  agent_sft_and_smoke_tests:
    needs: segment_66
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore corpus and tokenizer cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/fineweb2_fr_14day.jsonl
            data/fineweb2_fr_14day.jsonl.source.json
            runs/ghost-fr-14day/dataset
            runs/ghost-fr-14day/tokens
            runs/ghost-fr-14day/tokenizer.json
            runs/ghost-fr-14day/run_config.json
          key: ghost-fr-14day-v1-${{ github.sha }}-${{ github.run_attempt }}

      - name: Download final pretrained checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ghost-state
          path: runs/ghost-fr-14day

      - name: Install data and browser dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install '.[data,browser]'

      - name: Compile and verify native C engine
        run: |
          python build_native.py
          test -f python/ghost/libghost.so
          python -c "from ghost import Tensor; t=Tensor([[1.0, 2.0]]); assert t.data == [1.0, 2.0]; t.free(); print('Ghost C engine OK')"

      - name: Export final checkpoint as base model
        run: python examples/export_ghost_checkpoint.py --run-dir runs/ghost-fr-14day

      - name: Build examples for the actual ghost tool registry
        run: python examples/build_ghost_agent_sft.py --output data/ghost-tool-sft.jsonl

      - name: Fetch 500 human-style French instruction examples
        run: |
          python examples/fetch_french_instruct_sft.py \
            --max-examples 500 --seed 42 \
            --output data/french-instruct-sft.jsonl \
            --manifest data/french-instruct-sft.source.json

      - name: Merge and shuffle French instruction and tool examples
        run: |
          python examples/merge_ghost_sft_manifests.py \
            --inputs data/ghost-tool-sft.jsonl data/french-instruct-sft.jsonl \
            --output data/ghost-agent-sft-combined.jsonl --seed 42

      - name: Supervised fine-tuning for French responses and ghost tool calls
        run: |
          python examples/train_ghost_sft.py data/ghost-agent-sft-combined.jsonl \
            --base runs/ghost-fr-14day \
            --output runs/ghost-agent-sft \
            --epochs 5 --learning-rate 8e-5 --weight-decay 0.01 --seed 42

      - name: Evaluate JSON action format and tool selection
        continue-on-error: true
        run: |
          python examples/evaluate_ghost_agent.py \
            --base-dir runs/ghost-fr-14day \
            --sft-dir runs/ghost-agent-sft \
            --output runs/ghost-agent-sft/evaluation.json

      - name: Install browser and isolated-code runtime
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m playwright install --with-deps chromium

      - name: Browser agent smoke test on Python documentation only
        continue-on-error: true
        run: |
          python examples/run_ghost_agent.py runs/ghost-agent-sft \
            --model tool-model.json \
            --tokenizer runs/ghost-fr-14day/tokenizer.json \
            --allow-domain docs.python.org \
            --browser --max-steps 4 --timeout 90 \
            --task "Ouvre https://docs.python.org/3/library/pathlib.html et résume le sujet de la page." \
            > runs/ghost-agent-sft/browser-smoke-test.json 2>&1

      - name: Isolated Python sandbox agent smoke test
        continue-on-error: true
        run: |
          python examples/run_ghost_agent.py runs/ghost-agent-sft \
            --model tool-model.json \
            --tokenizer runs/ghost-fr-14day/tokenizer.json \
            --allow-domain docs.python.org \
            --enable-code --max-steps 4 --timeout 60 \
            --task "Exécute print(2 + 2) dans le bac à sable Python et rapporte le résultat." \
            > runs/ghost-agent-sft/python-sandbox-smoke-test.json 2>&1

      - name: Enforce actual browser and sandbox agent acceptance
        if: always()
        run: |
          python examples/verify_ghost_agent_smoke.py \
            --evaluation runs/ghost-agent-sft/evaluation.json \
            --browser-report runs/ghost-agent-sft/browser-smoke-test.json \
            --sandbox-report runs/ghost-agent-sft/python-sandbox-smoke-test.json \
            --output runs/ghost-agent-sft/agent-acceptance.json \
            --minimum-tool-accuracy 0.50 \
            --minimum-valid-action-rate 0.75

      - name: Upload final model, SFT and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-0.7.0-final-agent-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            runs/ghost-fr-14day/model.json
            runs/ghost-fr-14day/tokenizer.json
            runs/ghost-fr-14day/checkpoint.json
            runs/ghost-fr-14day/metrics.jsonl
            runs/ghost-fr-14day/run_status.json
            runs/ghost-fr-14day/report.txt
            runs/ghost-agent-sft/tool-model.json
            runs/ghost-agent-sft/checkpoint.json
            runs/ghost-agent-sft/evaluation.json
            runs/ghost-agent-sft/browser-smoke-test.json
            runs/ghost-agent-sft/python-sandbox-smoke-test.json
            runs/ghost-agent-sft/agent-acceptance.json
            data/french-instruct-sft.source.json
            data/ghost-agent-sft-combined.jsonl

