name: ghost — 14-day CPU pretraining + agent SFT

on:
  push:
    branches:
      - training/ghost-0.7.0

permissions:
  contents: read
  actions: read

concurrency:
  group: ghost-0.7.0-14day-training
  cancel-in-progress: false

jobs:
  prepare_data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore a partial or completed corpus cache on retry
        id: previous-data-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/fineweb2_fr_14day.jsonl
            data/fineweb2_fr_14day.jsonl.source.json
            runs/ghost-fr-14day/dataset
            runs/ghost-fr-14day/tokens
            runs/ghost-fr-14day/tokenizer.json
            runs/ghost-fr-14day/run_config.json
          key: ghost-fr-14day-v1-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ghost-fr-14day-v1-${{ github.sha }}-

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install '.[data]'

      - name: Compile and verify native C engine
        run: |
          python build_native.py
          test -f python/ghost/libghost.so
          python -c "from ghost import Tensor; t=Tensor([[1.0, 2.0]]); assert t.data == [1.0, 2.0]; t.free(); print('Ghost C engine OK')"

      - name: Stream the larger French FineWeb2-HQ sample
        run: |
          python examples/fetch_hf_stream.py \
            --dataset Brainquiver/general-web-fr-202608 \
            --config fineweb2-hq-fra_Latn \
            --revision 47d4541fa39938293ec294baccd91de876c32ac9 \
            --output data/fineweb2_fr_14day.jsonl \
            --max-documents 100000 \
            --max-total-chars 200000000 \
            --min-language-score 0.95 \
            --min-quality-score 0.30 \
            --resume

      - name: Prepare corpus, tokenizer and token shards
        run: |
          python examples/train_ghost_long.py data/fineweb2_fr_14day.jsonl \
            --output runs/ghost-fr-14day \
            --vocab-size 4096 --min-frequency 2 \
            --d-model 128 --heads 4 --layers 4 --context 512 \
            --epochs 10000 --steps-per-epoch 20000 \
            --checkpoint-every-steps 500 \
            --learning-rate 2e-4 --weight-decay 0.05 \
            --tokens-per-shard 1000000 --seed 42 \
            --prepare-only

      - name: Save prepared or partially downloaded corpus for retry
        if: always() && steps.previous-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/fineweb2_fr_14day.jsonl
            data/fineweb2_fr_14day.jsonl.source.json
            runs/ghost-fr-14day/dataset
            runs/ghost-fr-14day/tokens
            runs/ghost-fr-14day/tokenizer.json
            runs/ghost-fr-14day/run_config.json
          key: ghost-fr-14day-v1-${{ github.sha }}-${{ github.run_attempt }}

